<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【店員レジ】ラ・サール学園バザー POS</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2>POSレジ管理</h2>
      <a href="index.html" class="back-to-shop-btn">‹ 注文画面へ戻る</a>
    </div>
    <div id="operator-badge" class="user-badge">レジ認証中...</div>
  </header>

  <div class="workspace">
    <!-- 左パネル: カメラスキャン ＆ 手入力 -->
    <div class="left-panel">
      <div class="camera-box">
        <video id="video-preview" autoplay playsinline muted></video>
        <canvas id="camera-canvas" hidden></canvas>
        <div id="scan-feedback" class="scan-feedback"></div>
      </div>
      <div>
        <label class="input-label">手入力検索 (ユーザーID / 注文ID)</label>
        <div class="input-group">
          <input type="text" id="manual-id-input" placeholder="例: user@example.com / ORD0001">
          <button onclick="submitManualSearch()" class="btn-search">検索</button>
        </div>
      </div>
    </div>

    <!-- 中央パネル: 注文・合算詳細表示 -->
    <div class="center-panel">
      <div id="placeholder" class="placeholder-box">
        <span class="material-icons">qr_code_scanner</span>
        <p>QRコードをカメラにかざすか、ユーザーID/注文IDを手入力してください。</p>
      </div>

      <div id="order-card" class="order-card" style="display: none;">
        <div class="card-header">
          <div>
            <h3 id="card-user-id" class="text-primary">user@example.com</h3>
            <span id="card-status-badge" class="badge-status">未払いあり</span>
          </div>
          <div id="card-student-info" class="text-muted font-bold">高2A 15番</div>
        </div>

        <div id="card-items" class="card-items-container"></div>

        <div class="total-box">
          <span class="total-label">お会計 合計受領額</span>
          <span id="card-total" class="total-amount">¥0</span>
        </div>
      </div>
    </div>

    <!-- 右パネル: 3大操作ボタン -->
    <div class="right-panel">
      <button class="btn-main btn-pay" id="btn-pay" onclick="handlePayment()" disabled>
        <span class="material-icons">check_circle</span>
        <span>🟢 会計確定</span>
      </button>
      <button class="btn-main btn-deliver" id="btn-deliver" onclick="handleDelivery()" disabled>
        <span class="material-icons">local_shipping</span>
        <span>🔵 引き渡し完了</span>
      </button>
      <button class="btn-cancel" id="btn-cancel" onclick="handleCancelLock()" disabled>🔴 注文中断</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
