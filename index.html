<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ラ・サール学園バザー オンライン注文</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>ラ・サール学園バザー</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <a id="admin-link" href="admin.html" class="admin-nav-btn" style="display: none;">POSレジ画面へ</a>
      <div id="user-badge" class="user-badge">読込中...</div>
    </div>
  </header>

  <div class="container" id="product-list"></div>

  <div class="cart-bar" id="cart-bar">
    <button class="cart-btn" onclick="openCartReview()">
      <span class="material-icons">shopping_cart</span>
      注文内容を確認する (<span id="cart-total">¥0</span>)
    </button>
  </div>

  <!-- 🛒 カート内容最終確認モーダル (編集不可・閲覧のみ) -->
  <div class="modal" id="review-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛒 注文内容の最終確認</h3>
        <span class="material-icons close-btn" onclick="closeModal('review-modal')">close</span>
      </div>
      <div id="review-items"></div>
      <div class="modal-total-row">
        <span>合計金額:</span>
        <span id="modal-total" class="text-danger">¥0</span>
      </div>
      <button class="cart-btn btn-success" onclick="submitFinalOrder()">
        <span class="material-icons">done_all</span>
        この内容で注文を確定する
      </button>
    </div>
  </div>

  <!-- 🔒 注文完了 ＆ 偽造防止QR表示モーダル -->
  <div class="modal" id="success-modal">
    <div class="modal-content text-center">
      <span class="material-icons success-icon">check_circle</span>
      <h2>ご注文が確定しました！</h2>
      <p class="screenshot-notice">※当日スムーズに引き換えるため、この画面のスクリーンショットを保存してください。</p>
      
      <div id="qrcode-area" class="qrcode-container"></div>

      <div class="order-summary-box">
        <div class="summary-header">
          <span>注文ID: <b id="res-order-id">-</b></span>
          <span id="res-total" class="text-danger font-bold">¥0</span>
        </div>
        <div id="res-items-detail" class="summary-details"></div>
      </div>

      <p class="mail-notice">※同じ内容の案内メールをご登録のGmail宛てにも自動送信しました。</p>
      <button class="cart-btn" onclick="location.reload()">トップに戻る</button>
    </div>
  </div>

  <!-- ⏳ 暗転ローディング -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">データを安全に読み込み中...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
