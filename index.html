<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ラ・サール学園バザー オンライン注文</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>ラ・サール学園バザー</h1>
    <div id="user-badge" style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px;">読込中...</div>
  </header>

  <div class="container" id="product-list"></div>

  <div class="cart-bar" id="cart-bar">
    <button class="cart-btn" onclick="openCartReview()">
      <span class="material-icons">shopping_cart</span>
      注文内容を確認する (<span id="cart-total">¥0</span>)
    </button>
  </div>

  <div class="modal" id="review-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">🛒 注文内容の最終確認</h3>
      <div id="review-items"></div>
      <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin: 20px 0;">
        <span>合計金額:</span>
        <span id="modal-total" style="color: var(--danger);">¥0</span>
      </div>
      <button class="cart-btn" style="background: #16A34A;" onclick="submitOrder()">この内容で注文を確定する</button>
    </div>
  </div>

  <div class="modal" id="success-modal" style="align-items: center; padding: 16px;">
    <div class="modal-content" style="border-radius: 20px; text-align: center;">
      <span class="material-icons" style="color: #16A34A; font-size: 56px;">check_circle</span>
      <h2>ご注文が確定しました！</h2>
      <p style="font-size: 12px; color: var(--danger); margin: 8px 0; font-weight: 700;">※この画面のスクリーンショットを保存してください。</p>
      <div id="qrcode-area" style="margin: 16px auto; display: inline-block;"></div>
      <div style="background: var(--primary-light); padding: 12px; border-radius: 10px; text-align: left; font-size: 14px; margin-bottom: 16px;">
        <div>注文ID: <b id="res-order-id">-</b></div>
        <div>合計金額: <b id="res-total">¥0</b></div>
      </div>
      <button class="cart-btn" onclick="location.reload()">トップに戻る</button>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="font-size: 14px; font-weight: 700;">データを安全に読み込み中...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
